<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrow Escape</title>
    <meta name="description" content="A strategic arrow-unblocking puzzle game.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <div>
                <p class="game-label">GAMEHUB ORIGINAL</p>
                <h1>Arrow Escape</h1>
            </div>

            <div class="stats">
                <div class="stat">
                    <span>LEVEL</span>
                    <strong id="level">1</strong>
                </div>

                <div class="stat">
                    <span>LIVES</span>
                    <strong id="lives">❤️❤️❤️</strong>
                </div>
            </div>
        </header>


        <section class="game-area">

            <div class="board" id="board">
                <!-- Arrows are generated by JavaScript -->
            </div>

        </section>


        <div class="game-message" id="gameMessage">
            Clear all the arrows!
        </div>


        <button class="restart-button" id="restartButton">
            Restart Level
        </button>

    </main>


    <script src="js/game.js"></script>

</body>
</html>
