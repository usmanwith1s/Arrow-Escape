<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrow Escape</title>
    <meta
        name="description"
        content="Arrow Escape is a strategic directional-arrow puzzle game."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<main class="game-app">

    <!-- =========================
         TOP BAR
    ========================== -->
    <header class="topbar">

        <div class="topbar-side topbar-left">
            <button class="top-button" id="backButton" type="button">
                <span aria-hidden="true">←</span>
                Back
            </button>

            <button class="top-button" id="restartButton" type="button">
                <span aria-hidden="true">↻</span>
                Restart
            </button>
        </div>

        <div class="topbar-center">
            <div class="brand-small">ARROW ESCAPE</div>
            <div class="difficulty-name" id="difficultyName">Easy</div>
            <div class="level-label" id="levelLabel">Level 1</div>
        </div>

        <div class="topbar-side topbar-right">
            <div
                class="hearts"
                id="hearts"
                aria-label="3 lives remaining"
            ></div>
        </div>

    </header>


    <!-- =========================
         GAME AREA
    ========================== -->
    <section class="game-section">

        <div class="game-toolbar">

            <div class="toolbar-left">
                <button class="action-button" id="hintButton" type="button">
                    <span aria-hidden="true">✦</span>
                    Hint
                </button>

                <button
                    class="action-button"
                    id="undoButton"
                    type="button"
                    disabled
                >
                    <span aria-hidden="true">↶</span>
                    Undo
                </button>
            </div>

            <div
                class="status-area"
                id="statusText"
                aria-live="polite"
            >
                Clear all the arrows.
            </div>

            <div class="progress-area">
                <span id="progressText">0 / 36</span>

                <div class="progress-track">
                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>
                </div>
            </div>

        </div>


        <!-- =========================
             BOARD
        ========================== -->
        <div class="board-wrap" id="boardWrap">

            <svg
                id="boardSvg"
                class="board-svg"
                xmlns="http://www.w3.org/2000/svg"
                role="grid"
                aria-label="Arrow Escape puzzle board"
            >
                <g id="world">

                    <g id="gridGroup"></g>

                    <!-- Arrows are generated by JavaScript -->

                </g>
            </svg>

            <div
                class="zoom-tip"
                id="zoomTip"
                aria-hidden="true"
            >
                Pinch / scroll to zoom · drag to pan
            </div>

        </div>

    </section>


    <!-- =========================
         FLOATING GRID BUTTON
    ========================== -->
    <button
        class="floating-button"
        id="gridToggle"
        type="button"
        aria-pressed="false"
        aria-label="Toggle grid lines"
        title="Toggle grid lines"
    >
        ▦
    </button>


    <!-- =========================
         WIN OVERLAY
    ========================== -->
    <div
        class="overlay"
        id="winOverlay"
        hidden
    >
        <div
            class="overlay-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="winTitle"
        >
            <div class="overlay-kicker">PUZZLE CLEARED</div>

            <h2 id="winTitle">Level Complete</h2>

            <div
                class="star-rating"
                id="starRating"
                aria-label="Level rating"
            >
                ★★★
            </div>

            <p id="winDetails">
                Excellent. You cleared the board.
            </p>

            <div class="overlay-actions">

                <button
                    class="primary-button"
                    id="nextLevelButton"
                    type="button"
                >
                    Next Level
                </button>

                <button
                    class="secondary-button"
                    id="winMenuButton"
                    type="button"
                >
                    Menu
                </button>

            </div>
        </div>
    </div>


    <!-- =========================
         GAME OVER OVERLAY
    ========================== -->
    <div
        class="overlay"
        id="gameOverOverlay"
        hidden
    >
        <div
            class="overlay-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="gameOverTitle"
        >
            <div class="overlay-kicker">TRY AGAIN</div>

            <h2 id="gameOverTitle">Out of Lives</h2>

            <p>
                The puzzle is still here. Plan the next sequence carefully.
            </p>

            <div class="overlay-actions">

                <button
                    class="primary-button"
                    id="retryButton"
                    type="button"
                >
                    Retry
                </button>

                <button
                    class="secondary-button"
                    id="newPuzzleButton"
                    type="button"
                >
                    New Puzzle
                </button>

            </div>
        </div>
    </div>


</main>

<script src="js/game.js"></script>
</body>
</html>
