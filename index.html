<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrow Escape</title>
    <meta
        name="description"
        content="Arrow Escape — a strategic directional arrow puzzle game."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="game-app">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="topbar-side">
            <button class="top-button" id="backButton" type="button">
                ← Back
            </button>

            <button class="top-button" id="restartButton" type="button">
                ↻ Restart
            </button>
        </div>

        <div class="topbar-center">
            <div class="brand-small">ARROW ESCAPE</div>
            <div class="difficulty-name" id="difficultyName">
                Easy
            </div>
            <div class="level-label" id="levelLabel">
                Level 1
            </div>
        </div>

        <div class="topbar-side topbar-right">
            <div
                class="hearts"
                id="hearts"
                aria-label="3 lives remaining"
            ></div>
        </div>

    </header>


    <!-- GAME -->
    <section class="game-section">

        <div class="game-toolbar">

            <div class="toolbar-left">

                <button
                    class="action-button"
                    id="hintButton"
                    type="button"
                >
                    ✦ Hint
                </button>

                <button
                    class="action-button"
                    id="undoButton"
                    type="button"
                    disabled
                >
                    ↶ Undo
                </button>

            </div>

            <div
                class="status-area"
                id="statusText"
                aria-live="polite"
            >
                Clear all the arrows.
            </div>

            <div class="progress-area">

                <span id="progressText">
                    0 / 36
                </span>

                <div class="progress-track">
                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>
                </div>

            </div>

        </div>


        <!-- BOARD -->
        <div class="board-wrap" id="boardWrap">

            <svg
                id="boardSvg"
                class="board-svg"
                xmlns="http://www.w3.org/2000/svg"
                role="grid"
                aria-label="Arrow Escape puzzle board"
            >

                <g id="world">
                    <g id="gridGroup"></g>
                </g>

            </svg>

            <div
                class="zoom-tip"
                id="zoomTip"
            >
                Pinch / scroll to zoom · drag to pan
            </div>

        </div>

    </section>


    <!-- GRID TOGGLE -->
    <button
        class="floating-button"
        id="gridToggle"
        type="button"
        aria-pressed="false"
        aria-label="Toggle grid lines"
    >
        ▦
    </button>


    <!-- WIN -->
    <div
        class="overlay"
        id="winOverlay"
        hidden
    >

        <div
            class="overlay-card"
            role="dialog"
            aria-modal="true"
        >

            <div class="overlay-kicker">
                PUZZLE CLEARED
            </div>

            <h2>
                Level Complete
            </h2>

            <div
                class="star-rating"
                id="starRating"
            >
                ★★★
            </div>

            <p id="winDetails">
                Excellent. You cleared the board.
            </p>

            <div class="overlay-actions">

                <button
                    class="primary-button"
                    id="nextLevelButton"
                    type="button"
                >
                    Next Level
                </button>

                <button
                    class="secondary-button"
                    id="winMenuButton"
                    type="button"
                >
                    Menu
                </button>

            </div>

        </div>

    </div>


    <!-- GAME OVER -->
    <div
        class="overlay"
        id="gameOverOverlay"
        hidden
    >

        <div
            class="overlay-card"
            role="dialog"
            aria-modal="true"
        >

            <div class="overlay-kicker">
                TRY AGAIN
            </div>

            <h2>
                Out of Lives
            </h2>

            <p>
                The puzzle is still here.
                Try a different order.
            </p>

            <div class="overlay-actions">

                <button
                    class="primary-button"
                    id="retryButton"
                    type="button"
                >
                    Retry
                </button>

                <button
                    class="secondary-button"
                    id="newPuzzleButton"
                    type="button"
                >
                    New Puzzle
                </button>

            </div>

        </div>

    </div>

</main>

<script src="js/game.js"></script>

</body>
</html>
